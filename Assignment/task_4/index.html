<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <form>
      <h3 align="center">Novell Services Login</h3>
      <table align="center">
        <tr>
          <td>Username:</td>
          <td><input type="text" name="" id="" size="30" /></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><input type="text" name="" id="" size="30" /></td>
        </tr>
        <tr>
          <td>City of <br />Employment:</td>
          <td><input type="text" name="" id="" size="30" /></td>
        </tr>
        <br />
        <br />
        <br />
        <br />
        <tr align="left">
          <td>Web Server</td>
          <td>
            <select name="webserv" size="1">
              <option value="default" selected>--- Choose a server ---</option>
              <option value="Human Resources">Human Resources</option>
              <option value="Development">Development</option>
              <option value="Accounting">Accounting</option>
              <option value="Sales">Sales</option>
            </select>
            <br />
            <br />
            <br />
          </td>
        </tr>

        <tr>
          <td>
            Please specify <br />
            your role:
          </td>
          <td align="left">
            <input type="radio" name="role" id="" />Admin<br />
            <input type="radio" name="role" id="" />Engineer<br />
            <input type="radio" name="role" id="" />Manager<br />
            <input type="radio" name="role" id="" />Guest<br />

            <tr>
              <td colspan="2" align="left">
                <p></p>
              </td>
            </tr>

            <tr>
              <td colspan="2" align="left">
                <p></p>
              </td>
            </tr>

            <tr align="left">
              <td>Single Sign-on<br />to the following:</td>
              <td>
                <input name="mail" type="checkbox" />Mail<br />
                <input name="payroll" type="checkbox" />Payroll<br />
                <input name="selfservice" type="checkbox" />Self-service<br />
              </td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <input value="Login" type="submit" />
                <input type="reset" />
              </td>
            </tr>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
